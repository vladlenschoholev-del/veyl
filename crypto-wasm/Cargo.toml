[package]
name = "ustoy-crypto-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = "=0.3.3"
subtle = "=2.6.1"
veyl-crypto-core = { path = "../crypto-core", features = ["wasm"] }
wasm-bindgen = "=0.2.106"
zeroize = { version = "=1.8.1", features = ["derive"] }

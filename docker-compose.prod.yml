name: ustoy

services:
  relay:
    build:
      context: .
      dockerfile: relay-server/Dockerfile
    environment:
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
    expose:
      - "8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine@sha256:fc9cbc100585871d18d4e451cca7021785c90a7006087427ae5ceb3e4efe6424
    platform: linux/amd64
    environment:
      USTOY_HOSTNAME: "${USTOY_HOSTNAME:-localhost}"
    depends_on:
      - relay
    ports:
      - "${USTOY_BIND:-127.0.0.1}:80:80"
      - "${USTOY_BIND:-127.0.0.1}:443:443"
      - "${USTOY_BIND:-127.0.0.1}:443:443/udp"
    volumes:
      - ./client-app/dist:/srv:ro
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

  tor:
    profiles:
      - tor
    build:
      context: deploy/tor
    depends_on:
      - proxy
    ports:
      - "${USTOY_TOR_BIND:-127.0.0.1}:9050:9050"
    volumes:
      - tor_state:/var/lib/tor
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  tor_state:

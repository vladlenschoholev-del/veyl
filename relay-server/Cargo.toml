[package]
name = "veyl-relay-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[dependencies]
axum = "=0.8.4"
getrandom = "=0.3.3"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tokio = { version = "=1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "=0.6.6", features = ["cors"] }
veyl-crypto-core = { path = "../crypto-core" }
zeroize = { version = "=1.8.1", features = ["derive"] }

[dev-dependencies]
http-body-util = "=0.1.3"
image = { version = "=0.25.8", default-features = false, features = ["jpeg"] }
tower = { version = "=0.5.2", features = ["util"] }

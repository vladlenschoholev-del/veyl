[package]
name = "veyl-crypto-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[features]
wasm = ["getrandom/wasm_js", "dep:getrandom_02"]

[dependencies]
argon2 = "=0.5.3"
chacha20poly1305 = { version = "=0.10.1", features = ["std"] }
getrandom = "=0.3.3"
getrandom_02 = {
    package = "getrandom",
    version = "=0.2.17",
    features = ["js"],
    optional = true,
}
hkdf = "=0.12.4"
hmac = "=0.12.1"
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
ml-kem = { version = "=0.3.0", features = ["getrandom", "zeroize"] }
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.12"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets", "zeroize"] }
zeroize = { version = "=1.8.1", features = ["derive"] }


